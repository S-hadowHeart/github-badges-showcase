<svg xmlns="http://www.w3.org/2000/svg" width="232" height="28" role="img" aria-label="self-hosted: SVG badge">
  <title>self-hosted: SVG badge</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6e40c9"/>
      <stop offset="1" stop-color="#1f6feb"/>
    </linearGradient>
    <clipPath id="r"><rect width="232" height="28" rx="6"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="232" height="28" fill="#24292f"/>
    <rect width="96" height="28" fill="url(#g)"/>
  </g>
  <g fill="#ffffff" font-family="Verdana,DejaVu Sans,Geneva,sans-serif" font-size="11" text-anchor="middle">
    <text x="48" y="18" font-weight="700">self-hosted</text>
    <text x="164" y="18">SVG badge</text>
  </g>
</svg>
