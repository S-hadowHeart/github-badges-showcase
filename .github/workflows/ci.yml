name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-catalog:
    name: Verify badge catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check structure (offline)
        run: node scripts/verify.mjs

      - name: Check every badge URL (online)
        run: node scripts/verify.mjs --online
        continue-on-error: true
